<!doctype html><html><head><meta charset="utf-8"><title>HTTP Request Security Analyzer</title>
<style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#172033}header{background:#172033;color:white;padding:25px}main{max-width:1100px;margin:25px auto;padding:0 20px}.card{background:white;padding:22px;margin:18px 0;border-radius:10px}textarea{width:100%;height:220px;font-family:monospace}button{padding:12px 20px;background:#172033;color:white;border:0;border-radius:6px;margin-top:12px}.finding{padding:15px;border:1px solid #ddd;margin:10px 0;border-radius:8px}.HIGH{color:#b91c1c}.MEDIUM{color:#b45309}.LOW{color:#15803d}</style></head>
<body><header><h1>HTTP Request Security Analyzer</h1><p>Passive security analysis for captured or simulated HTTP requests</p></header>
<main><div class="card"><h2>HTTP Request</h2><textarea id="req">GET /search?q=../admin HTTP/1.1
Host: example.test
Cookie: session=demo-session
Origin: null
Authorization: Basic ZGVtbzpwYXNz
X-Powered-By: DemoServer/1.0</textarea><br><button onclick="run()">Analyze Request</button></div>
<div class="card"><h2>Summary</h2><div id="summary">No analysis yet.</div></div><div class="card"><h2>Findings</h2><div id="findings">No analysis yet.</div></div></main>
<script>
function parse(raw){let l=raw.split(/\r?\n/),p=l[0].split(/\s+/),h={},i=1;for(;i<l.length&&l[i].trim();i++){let n=l[i].indexOf(':');if(n>0)h[l[i].slice(0,n).trim()]=l[i].slice(n+1).trim()}return{method:p[0]||'GET',url:p[1]||'/',headers:h,body:l.slice(i+1).join('\n')}}
async function run(){let r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(parse(document.getElementById('req').value))});let x=await r.json();document.getElementById('summary').innerHTML=`<b>Risk:</b> ${x.summary.risk_score}/100 &nbsp; <b>Level:</b> ${x.summary.risk_level} &nbsp; <b>Findings:</b> ${x.summary.finding_count}`;document.getElementById('findings').innerHTML=x.findings.map(f=>`<div class="finding"><b class="${f.severity}">${f.severity}</b><h3>${f.title}</h3><p>${f.description}</p><p><b>Recommendation:</b> ${f.recommendation}</p></div>`).join('')||'No security indicators detected.'}
</script></body></html>
